<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Container signing vs model signing</title>
  <desc id="desc">Two parallel flows. Left: build image, digest, Cosign or Notation sign, registry, verify before deploy. Right: export model pack, file inventory or OCI ModelKit, OpenSSF model-signing or Cosign, registry, verify before serve. Middle links mark the same skills. Bottom note: single digest vs multi-file tree, and a signature does not prove clean training.</desc>
  <rect width="1280" height="720" fill="#ffffff"/>
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1971c2"/></marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#adb5bd"/></marker>
  </defs>

  <text x="640" y="48" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="30" fill="#1e1e1e">Container signing  vs  model signing</text>
  <text x="640" y="78" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="16" fill="#868e96">Same refuse habit. Different shape of the thing you hash.</text>

  <rect x="70" y="110" width="340" height="44" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5"/>
  <text x="240.0" y="140" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="22" fill="#1864ab">Containers</text>
  <rect x="770" y="110" width="340" height="44" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="940.0" y="140" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="22" fill="#2b8a3e">Models</text>
  <rect x="70" y="170" width="340" height="58" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="240.0" y="206" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="17" fill="#212529">Build the image</text>
  <rect x="770" y="170" width="340" height="58" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="940.0" y="206" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="17" fill="#212529">Export the model pack</text>
  <line x1="420" y1="199" x2="760" y2="199" stroke="#1971c2" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="590.0" y="188" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#1971c2">same: produce</text>
  <line x1="240.0" y1="228" x2="240.0" y2="248" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="940.0" y1="228" x2="940.0" y2="248" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrGray)"/>
  <rect x="70" y="248" width="340" height="58" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="240.0" y="284" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="17" fill="#212529">Image digest</text>
  <rect x="770" y="248" width="340" height="58" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="940.0" y="284" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="17" fill="#212529">File inventory or OCI ModelKit</text>
  <line x1="420" y1="277" x2="760" y2="277" stroke="#1971c2" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="590.0" y="266" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#1971c2">same: digest</text>
  <line x1="240.0" y1="306" x2="240.0" y2="326" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="940.0" y1="306" x2="940.0" y2="326" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrGray)"/>
  <rect x="70" y="326" width="340" height="58" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="240.0" y="362" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="17" fill="#212529">Sign with Cosign / Notation</text>
  <rect x="770" y="326" width="340" height="58" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="940.0" y="362" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="17" fill="#212529">Sign with model-signing or Cosign</text>
  <line x1="420" y1="355" x2="760" y2="355" stroke="#1971c2" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="590.0" y="344" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#1971c2">same: sign + trust</text>
  <line x1="240.0" y1="384" x2="240.0" y2="404" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="940.0" y1="384" x2="940.0" y2="404" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrGray)"/>
  <rect x="70" y="404" width="340" height="58" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="240.0" y="440" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="17" fill="#212529">Push to registry</text>
  <rect x="770" y="404" width="340" height="58" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="940.0" y="440" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="17" fill="#212529">Push to registry / artifacts</text>
  <line x1="420" y1="433" x2="760" y2="433" stroke="#1971c2" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="590.0" y="422" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#1971c2">same: registry</text>
  <line x1="240.0" y1="462" x2="240.0" y2="482" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrGray)"/>
  <line x1="940.0" y1="462" x2="940.0" y2="482" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrGray)"/>
  <rect x="70" y="482" width="340" height="58" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="240.0" y="518" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="17" fill="#212529">Verify before deploy / admit</text>
  <rect x="770" y="482" width="340" height="58" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="940.0" y="518" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="17" fill="#212529">Verify before serve / load</text>
  <line x1="420" y1="511" x2="760" y2="511" stroke="#1971c2" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="590.0" y="500" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#1971c2">same: admit</text>
  <rect x="160" y="578" width="960" height="78" rx="14" fill="#fff9db" stroke="#e67700" stroke-width="2.5"/>
  <text x="640" y="608" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="18" fill="#e67700">What differs</text>
  <text x="640" y="634" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="15" fill="#495057">Single image digest vs multi-file model tree. A valid signature still says nothing about clean training.</text>
</svg>
