<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="820" viewBox="0 0 1480 820" role="img" aria-labelledby="title desc">
  <title id="title">Promote inventory loop with three BOMs</title>
  <desc id="desc">Ordered promote steps: Software SBOM and Grype on the serve env, ML-BOM with hash-check on the pack, AIBOM regen for runtime model calls, then promote and sign the pack. Fail closed on mismatch, High, or stale AIBOM.</desc>
  <rect width="1480" height="820" fill="#ffffff"/>

  <defs>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#868e96"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e03131"/></marker>
  </defs>

  <text x="740" y="40" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="28" fill="#1e1e1e">Promote: three inventories, then sign</text>
  <text x="740" y="68" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="15" fill="#868e96">Software SBOM · ML-BOM · AIBOM. Fail closed before serve.</text>

  <!-- 1 -->
  <rect x="30" y="120" width="190" height="160" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5"/>
  <text x="125" y="160" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="15" fill="#1864ab">1. Software SBOM</text>
  <text x="125" y="195" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">cyclonedx-py</text>
  <text x="125" y="218" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">or Syft</text>
  <text x="125" y="241" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">serve / train env</text>
  <text x="125" y="265" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="12" fill="#868e96">CVE graph</text>

  <line x1="230" y1="200" x2="260" y2="200" stroke="#868e96" stroke-width="2.5" marker-end="url(#arrGray)"/>

  <!-- 2 -->
  <rect x="270" y="120" width="190" height="160" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5"/>
  <text x="365" y="160" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="15" fill="#1864ab">2. Grype</text>
  <text x="365" y="195" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">scan env SBOM</text>
  <text x="365" y="218" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">--fail-on high</text>
  <text x="365" y="241" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">not weight dir</text>
  <text x="365" y="265" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="12" fill="#868e96">package CVEs</text>

  <line x1="470" y1="200" x2="500" y2="200" stroke="#868e96" stroke-width="2.5" marker-end="url(#arrGray)"/>

  <!-- 3 -->
  <rect x="510" y="120" width="190" height="160" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="605" y="160" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="15" fill="#2b8a3e">3. Stage + ML-BOM</text>
  <text x="605" y="195" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">pack on disk</text>
  <text x="605" y="218" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">file SHA-256</text>
  <text x="605" y="241" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">pedigree claim</text>
  <text x="605" y="265" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="12" fill="#868e96">hand-author OK</text>

  <line x1="710" y1="200" x2="740" y2="200" stroke="#868e96" stroke-width="2.5" marker-end="url(#arrGray)"/>

  <!-- 4 -->
  <rect x="750" y="120" width="190" height="160" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="845" y="160" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="15" fill="#2b8a3e">4. Hash-check</text>
  <text x="845" y="195" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">ML-BOM digests</text>
  <text x="845" y="218" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">== files on disk</text>
  <text x="845" y="241" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">exit 1 on drift</text>
  <text x="845" y="265" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="12" fill="#868e96">gate, not a report</text>

  <line x1="950" y1="200" x2="980" y2="200" stroke="#868e96" stroke-width="2.5" marker-end="url(#arrGray)"/>

  <!-- 5 -->
  <rect x="990" y="120" width="190" height="160" rx="14" fill="#fff4e6" stroke="#e67700" stroke-width="2.5"/>
  <text x="1085" y="160" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="15" fill="#e67700">5. AIBOM regen</text>
  <text x="1085" y="195" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">ollama list/show</text>
  <text x="1085" y="218" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">hash prompts</text>
  <text x="1085" y="241" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#212529">scan config IDs</text>
  <text x="1085" y="265" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="12" fill="#868e96">hand-curated</text>

  <line x1="1190" y1="200" x2="1220" y2="200" stroke="#868e96" stroke-width="2.5" marker-end="url(#arrGray)"/>

  <!-- 6 -->
  <rect x="1230" y="100" width="220" height="200" rx="14" fill="#fff9db" stroke="#e67700" stroke-width="3"/>
  <text x="1340" y="145" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="16" fill="#e67700">6. Promote</text>
  <text x="1340" y="175" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="14" fill="#212529">then sign</text>
  <text x="1340" y="198" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="14" fill="#212529">the pack</text>
  <line x1="1260" y1="220" x2="1420" y2="220" stroke="#e67700" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1340" y="250" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#2f9e44">model-signing</text>
  <text x="1340" y="272" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#2f9e44">/ KitOps</text>

  <!-- Fail closed -->
  <path d="M365 290 C365 380, 1100 430, 1280 450" fill="none" stroke="#e03131" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrRed)"/>
  <path d="M845 290 C845 360, 1180 430, 1280 450" fill="none" stroke="#e03131" stroke-width="2.5" stroke-dasharray="8 5"/>
  <path d="M1085 290 C1085 350, 1220 420, 1280 450" fill="none" stroke="#e03131" stroke-width="2.5" stroke-dasharray="8 5"/>

  <rect x="1285" y="420" width="160" height="70" rx="12" fill="#fff5f5" stroke="#e03131" stroke-width="2.5"/>
  <text x="1365" y="450" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="16" fill="#c92a2a">STOP</text>
  <text x="1365" y="474" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="13" fill="#c92a2a">High / mismatch / stale</text>

  <text x="980" y="490" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="14" fill="#e03131">fail closed. do not promote.</text>

  <!-- Bottom strip -->
  <rect x="80" y="560" width="1320" height="210" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="740" y="600" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="18" fill="#2b8a3e">What this loop is / is not</text>
  <text x="740" y="635" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="15" fill="#212529">Is: Software SBOM + ML-BOM + AIBOM + gates before promote.</text>
  <text x="740" y="665" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="15" fill="#212529">Is not: signing. Sign the pack after the gate, not sbom.json.</text>
  <text x="740" y="695" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="15" fill="#212529">Is not: provenance. Attest the train/export job separately (SLSA).</text>
  <text x="740" y="725" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, Segoe Print, cursive" font-size="14" fill="#495057">Adapters / Modelfile prompts / cloud IDs must appear in the right inventory or behavior drifts silently.</text>
</svg>
